<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 销售助手 · 手机端演示</title>
  <style>
    :root{--ink:#15213a;--sub:#71809a;--line:#e9edf3;--brand:#176bff;--soft:#f4f7fb;--bubble:#f0f4f8;--green:#22a87a;--warn:#e98b24}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 18%,#f2f6ff 0,#e8eef7 40%,#dde5f0 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    .phone{width:390px;height:min(844px,calc(100vh - 32px));overflow:hidden;position:relative;display:flex;flex-direction:column;background:#fff;border:9px solid #182236;border-radius:43px;box-shadow:0 25px 70px rgba(35,54,84,.28),inset 0 0 0 1px rgba(255,255,255,.35)}
    .speaker{position:absolute;z-index:3;top:8px;left:50%;width:112px;height:23px;transform:translateX(-50%);border-radius:15px;background:#182236}.status{height:37px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 21px 0;font-size:11px;font-weight:650}.status-icons{font-size:12px;letter-spacing:2px}
    .nav{height:54px;flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border-bottom:1px solid var(--line);padding:0 7px}.nav h1{margin:0;text-align:center;font-size:17px;letter-spacing:.2px}.icon-button{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:20px;background:transparent;color:var(--ink);font-size:23px;cursor:pointer}.more{font-size:22px;letter-spacing:1px}
    .profile-area{flex:none;margin:10px 16px 0}.profile-card,.contract-card{padding:12px;border:1px solid #dfe7f3;border-radius:14px;background:linear-gradient(106deg,#f7faff,#fff);box-shadow:0 4px 12px rgba(30,60,108,.05)}.profile-head{display:flex;align-items:center;gap:10px}.profile-avatar{width:40px;height:40px;display:grid;place-items:center;flex:none;border-radius:13px;background:linear-gradient(135deg,#287cff,#0755d9);color:#fff;font-size:17px;font-weight:700}.profile-main{min-width:0;flex:1}.profile-name{display:flex;align-items:center;gap:6px;font-size:14px}.profile-name b{white-space:nowrap}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.profile-main span{display:block;overflow:hidden;margin-top:4px;color:var(--sub);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.portrait{margin:10px 0 0;padding-top:10px;border-top:1px solid #e9eef5;color:#52637d;font-size:12px;line-height:1.6}.contract-card{margin-top:9px;padding:8px 12px}.contract-title{margin:0 0 3px;color:#7b899d;font-size:11px;font-weight:500}.contract-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:29px;color:#344761;font-size:12px}.contract-row+.contract-row{border-top:1px solid #edf1f6}.contract-row b{font-weight:600;white-space:nowrap}.contract-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .content{flex:1;overflow:auto;scroll-behavior:smooth;padding:0 16px 15px}.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:26px 4px 52px}.brief{padding:13px;border:1px solid #dfe7f2;border-radius:13px;background:#f8fbff;color:#465a78;font-size:12px;line-height:1.65}.brief-title{margin:0 0 5px;color:#263954;font-size:14px;font-weight:720}.brief strong{color:#155acc}.hint{margin:17px 0 10px;color:#9aa7ba;font-size:12px}.suggestions{display:flex;flex-direction:column;gap:9px}.suggestion{width:100%;padding:10px 12px;text-align:left;border:1px solid #dfe7f2;border-radius:13px;background:#fff;color:#40516e;font:13px inherit;line-height:1.35;box-shadow:0 2px 6px rgba(32,54,85,.03);cursor:pointer}.suggestion:active,.send:active,.action-chip:active{transform:scale(.96)}
    .chat{display:none;padding:18px 0 12px}.date{margin:0 0 17px;color:#a5b0c0;text-align:center;font-size:11px}.message{display:flex;align-items:flex-start;gap:9px;margin-bottom:18px}.message.user{justify-content:flex-end}.avatar{width:29px;height:29px;display:grid;place-items:center;flex:none;border-radius:10px;background:#176bff;color:#fff;font-size:14px}.user .avatar{order:2;background:#e7edf6;color:#53647e;font-size:12px}.bubble{max-width:280px;padding:11px 13px;border-radius:4px 14px 14px;background:var(--bubble);color:#243551;font-size:14px;line-height:1.65}.user .bubble{order:1;border-radius:14px 4px 14px 14px;background:#176bff;color:#fff}.answer{width:calc(100% - 38px)}.answer .bubble{max-width:none;background:transparent;padding:2px 0 0}.answer-title{margin:0 0 7px;font-size:15px;font-weight:720}.answer p{margin:5px 0}.insight-list{margin:6px 0 10px;padding-left:19px}.insight-list li{margin:3px 0}.reply-card{margin-top:10px;padding:11px;border:1px solid #dce6f4;border-radius:12px;background:#f8fbff}.reply-card small{display:block;margin-bottom:5px;color:#71809a;font-size:11px}.reply-card p{margin:0;color:#314869;font-size:13px;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.action-chip{padding:6px 9px;border:1px solid #d5e1f3;border-radius:10px;background:#fff;color:#2863bd;font:12px inherit;cursor:pointer}.follow{margin:3px 0 3px 38px;color:#60708a;font-size:12px}.follow button{margin:5px 5px 0 0;padding:7px 9px;border:1px solid #e1e7ef;border-radius:11px;background:#fff;color:#55709d;font:12px inherit;cursor:pointer}.typing{display:none;align-items:center;gap:5px;width:69px;height:43px;padding:13px;border-radius:5px 14px 14px;background:var(--bubble)}.typing i{width:5px;height:5px;border-radius:50%;background:#9ba9bc;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.25;transform:translateY(-2px)}}
    .composer{flex:none;padding:10px 14px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.97)}.input-wrap{display:flex;align-items:center;gap:8px;min-height:45px;padding:4px 5px 4px 13px;border:1px solid #dce4ef;border-radius:23px;background:#f8fafc}#query{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:14px inherit}.hold-to-talk{display:none;flex:1;height:35px;border:0;border-radius:18px;background:#e8f0fc;color:#3268bc;font:13px inherit;cursor:pointer}.input-wrap.voice{padding-left:5px}.input-wrap.voice #query{display:none}.input-wrap.voice .hold-to-talk{display:block}.send{width:35px;height:35px;display:grid;place-items:center;flex:none;border:0;border-radius:50%;background:#d9e5f9;color:#3976d2;cursor:pointer}.send svg{width:18px;height:18px}.send.ready{background:var(--brand);color:#fff}.menu{display:none;position:absolute;z-index:5;top:91px;right:15px;width:148px;padding:6px;border:1px solid #e4e9f0;border-radius:13px;background:#fff;box-shadow:0 12px 30px rgba(26,44,76,.16)}.menu.show{display:block}.menu button{width:100%;padding:11px 10px;border:0;border-radius:8px;background:transparent;color:#33445d;text-align:left;font:13px inherit;cursor:pointer}.toast{position:absolute;z-index:20;bottom:77px;left:50%;padding:9px 13px;border-radius:18px;background:rgba(24,36,57,.91);color:#fff;font-size:12px;opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:480px){body{background:#fff}.phone{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}.speaker{display:none}}
  </style>
</head>
<body>
  <main class="phone" aria-label="AI 销售助手手机端演示">
    <div class="speaker"></div>
    <div class="status"><span>9:41</span><span class="status-icons">▮▮▮ ◔ ▰</span></div>
    <header class="nav"><button class="icon-button" aria-label="返回" onclick="notify('返回会员详情（演示）')">‹</button><h1>AI 销售助手</h1><button class="icon-button more" aria-label="更多" onclick="toggleMenu()">···</button></header>
    <div class="menu" id="menu"><button onclick="newChat()">＋ 新建跟进对话</button><button onclick="notify('已打开该会员的跟进记录（演示）')">◷ 查看跟进记录</button><button onclick="notify('已清空本次对话（演示）')">⌫ 清空当前对话</button></div>
    <section class="profile-area" aria-label="当前用户画像"><article class="profile-card"><div class="profile-head"><div class="profile-avatar">演</div><div class="profile-main"><div class="profile-name"><b>演示会员</b><i class="status-dot" aria-label="有效会员"></i></div><span>女 · 9 岁 · 有效会员</span></div></div><p class="portrait">用户画像：持续参课；近期状态稳定；可在课程结束后关注学习感受与后续安排。</p></article><article class="contract-card" aria-label="当前合同"><p class="contract-title">当前合同</p><div class="contract-row"><span>少儿游泳进阶班次卡（有效）</span><b>剩余价值 42%</b></div><div class="contract-row"><span>家庭游泳年卡（有效）</span><b>剩余价值 68%</b></div></article></section>
    <section class="content" id="content"><div class="welcome" id="welcome"><div class="hint">你可以这样开始</div><div class="suggestions"><button class="suggestion" onclick="ask(this.textContent)">帮我生成本周的跟进开场</button><button class="suggestion" onclick="ask(this.textContent)">用户最近有没有正常参课</button><button class="suggestion" onclick="ask(this.textContent)">如何自然地推进续班？</button></div></div><div class="chat" id="chat"><p class="date">今天 09:41</p><div id="thread"></div><div class="message" id="typingRow"><span class="avatar">✦</span><div class="typing"><i></i><i></i><i></i></div></div></div></section>
    <footer class="composer"><div class="input-wrap" id="inputWrap"><input id="query" autocomplete="off" placeholder="点击输入或按住说话" oninput="setSendState()" onkeydown="if(event.key==='Enter') ask(this.value)" /><button class="hold-to-talk" onpointerdown="startVoice()" onpointerup="endVoice()" onpointercancel="endVoice()">按住说话</button><button class="send" id="send" aria-label="切换为语音输入" onclick="toggleInputMode()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"></path></svg></button></div></footer><div class="toast" id="toast"></div>
  </main>
  <script>
    const query=document.getElementById('query'),thread=document.getElementById('thread'),content=document.getElementById('content');
    const mic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"></path></svg>',keyboard='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h.01M10 10h.01M13 10h.01M16 10h.01M7 14h6M16 14h.01"></path></svg>';
    function setSendState(){send.classList.toggle('ready',!!query.value.trim())}function toggleMenu(){menu.classList.toggle('show')}function toggleInputMode(){const voice=inputWrap.classList.toggle('voice');send.innerHTML=voice?keyboard:mic;send.setAttribute('aria-label',voice?'切换为键盘输入':'切换为语音输入');if(!voice)query.focus()}function startVoice(){notify('正在聆听…')}function endVoice(){notify('语音输入完成（演示）')}function newChat(){menu.classList.remove('show');welcome.style.display='flex';chat.style.display='none';thread.innerHTML='';query.value='';setSendState()}
    function esc(value){return value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]))}function ask(text){text=(text||'').trim();if(!text)return;menu.classList.remove('show');welcome.style.display='none';chat.style.display='block';thread.insertAdjacentHTML('beforeend',`<div class="message user"><div class="bubble">${esc(text)}</div><span class="avatar">我</span></div>`);query.value='';setSendState();typingRow.style.display='flex';content.scrollTop=content.scrollHeight;setTimeout(()=>answer(text),620)}
    function answer(text){typingRow.style.display='none';const type=text.includes('参课')?'attendance':text.includes('续班')?'renew':text.includes('开场')?'opening':'free';const data={opening:{title:'建议先从本周课程安排自然开场：',body:'您好，周末的进阶班课程还是上午 10 点。<br>用户最近参课状态稳定，这周我们也会继续关注她的学习情况。'},attendance:{title:'用户近期参课状态正常：',body:'近两周已完成 3 次课程签到，没有缺勤记录。<br>下一节课为周六 10:00，可在课程后结合课堂表现继续跟进。'},renew:{title:'现在不建议直接推续班：',body:'会员仍有 10 节课；更合适的时机是剩余 4 至 6 节时。<br>本次可先确认用户的学习感受，并为后续续班埋下课程目标。'},free:{title:'我会围绕这位会员协助你跟进：',body:'我已结合她的课程、到店和既往跟进记录生成建议。<br>你可以补充用户的真实反馈，我会帮你整理为下一步跟进行动。'}}[type];const reply=type==='renew'?'您好，用户最近在进阶班的出勤很稳定。<br>想先了解一下她近期上课后的感受，是否有特别希望加强的内容？':type==='attendance'?'用户近两周参课状态正常，周六上午 10 点还有一节课程。<br>建议在课程结束后再结合课堂表现跟进。':'您好，周末的进阶班课程还是上午 10 点。<br>用户最近到店练习的状态不错，期待这周继续见到她。';thread.insertAdjacentHTML('beforeend',`<div class="message"><span class="avatar">✦</span><div class="answer"><div class="bubble"><p class="answer-title">${data.title}</p><p>${data.body}</p><div class="reply-card"><small>可直接发送</small><p>${reply}</p><div class="actions"><button class="action-chip" onclick="notify('话术已复制（演示）')">复制话术</button><button class="action-chip" onclick="notify('已进入编辑状态（演示）')">编辑</button></div></div></div><div class="follow">下一步：<button onclick="ask('如何自然地推进续班？')">推进续班</button><button onclick="notify('已生成待办：周六课程后跟进（演示）')">生成跟进待办</button><button onclick="notify('已保存为待跟进记录（演示）')">保存跟进记录</button></div></div></div>`);content.scrollTop=content.scrollHeight}
    let toastTimer;function notify(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
  </script>
</body>
</html>
