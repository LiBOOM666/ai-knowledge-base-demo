<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 知识库 · 手机端演示（需求对齐版）</title>
  <style>
    :root{--ink:#17233b;--sub:#71809a;--line:#e7edf5;--brand:#176bff;--soft:#f4f7fb;--bubble:#f0f4f8;--danger:#e25454}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,#f2f6ff 0,#e8eef7 42%,#dde5f0 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    .demo-shell{display:flex;align-items:center;gap:24px}.scenario-panel{width:184px;padding:16px;border:1px solid rgba(207,220,239,.9);border-radius:16px;background:rgba(255,255,255,.84);box-shadow:0 14px 36px rgba(55,76,109,.11)}.scenario-panel h2{margin:0 0 5px;font-size:15px}.scenario-panel p{margin:0 0 13px;color:var(--sub);font-size:12px;line-height:1.6}.scenario-button{width:100%;min-height:39px;padding:8px 10px;border:1px solid #d9e3f1;border-radius:10px;background:#fff;color:#40516e;text-align:left;font:13px inherit;cursor:pointer}.scenario-button+.scenario-button{margin-top:8px}.scenario-button:hover{border-color:#9dbcf0;background:#f5f8ff;color:#155acc}
    .phone{width:390px;height:min(844px,calc(100vh - 32px));overflow:hidden;position:relative;display:flex;flex-direction:column;background:#fff;border:9px solid #182236;border-radius:43px;box-shadow:0 25px 70px rgba(35,54,84,.28),inset 0 0 0 1px rgba(255,255,255,.35)}.speaker{position:absolute;z-index:3;top:8px;left:50%;width:112px;height:23px;transform:translateX(-50%);border-radius:15px;background:#182236}.status{height:37px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 21px 0;font-size:11px;font-weight:650}.status-icons{font-size:12px;letter-spacing:2px}.nav{height:54px;flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border-bottom:1px solid var(--line);padding:0 7px}.nav h1{margin:0;text-align:center;font-size:17px}.icon-button{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:20px;background:transparent;color:var(--ink);font-size:25px;cursor:pointer}.notice-area{flex:none;margin:10px 16px 0}.notice-card{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #d9e7ff;border-radius:14px;background:linear-gradient(100deg,#f5f9ff,#fff)}.notice-icon{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:11px;background:#e5efff;color:var(--brand);font-size:18px}.notice-copy{min-width:0}.notice-copy b,.notice-copy span{display:block}.notice-copy b{font-size:14px}.notice-copy span{margin-top:4px;color:#607596;font-size:11px;line-height:1.4}
    .content{flex:1;overflow:auto;padding:0 16px 15px;scroll-behavior:smooth}.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px 4px}.welcome h2{margin:0 0 18px;font-size:20px}.steps{display:grid;gap:0}.step{display:flex;gap:12px;align-items:flex-start;min-height:80px}.step-number{position:relative;width:26px;height:26px;display:grid;place-items:center;flex:none;border-radius:50%;background:#e8f1ff;color:#176bff;font-size:13px;font-weight:700}.step:first-child .step-number::after{position:absolute;top:32px;bottom:-54px;left:12px;width:1px;background:#d7e4f7;content:""}.step b,.step span{display:block}.step b{margin:2px 0 5px;font-size:14px}.step span{color:#627592;font-size:12px;line-height:1.55}.manual-link{margin-top:7px;padding:0;border:0;background:transparent;color:#2863bd;text-decoration:underline;text-underline-offset:3px;font:12px inherit;cursor:pointer}.chat{display:none;padding:18px 0 12px}.date{margin:0 0 17px;color:#a5b0c0;text-align:center;font-size:11px}.message{display:flex;gap:9px;align-items:flex-start;margin-bottom:18px}.message.user{justify-content:flex-end}.avatar{width:29px;height:29px;display:grid;place-items:center;flex:none;border-radius:10px;background:#176bff;color:#fff;font-size:14px}.user .avatar{order:2;background:#e7edf6;color:#53647e;font-size:12px}.bubble{max-width:280px;padding:11px 13px;border-radius:4px 14px 14px;background:var(--bubble);color:#243551;font-size:14px;line-height:1.65}.user .bubble{order:1;border-radius:14px 4px 14px 14px;background:#176bff;color:#fff}.answer{width:calc(100% - 38px)}.answer .bubble{max-width:none;background:transparent;padding:2px 0 0}.answer-title{margin:0 0 7px;font-size:15px;font-weight:720}.answer ul{margin:6px 0 10px;padding-left:19px}.source-card{display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;padding:10px;border:1px solid #dce6f4;border-radius:12px;background:#f8fbff;color:inherit;text-align:left;cursor:pointer}.source-icon{width:29px;height:32px;display:grid;place-items:center;flex:none;border-radius:7px;background:#e4efff;color:var(--brand);font-size:15px}.source-info{min-width:0;flex:1}.source-info b,.source-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-info b{font-size:12px}.source-info span{margin-top:3px;color:var(--sub);font-size:11px}.chevron{color:#93a1b6;font-size:20px}.follow{margin:3px 0 3px 38px;color:#60708a;font-size:12px}.follow button{margin:5px 5px 0 0;padding:7px 9px;border:1px solid #e1e7ef;border-radius:11px;background:#fff;color:#55709d;font:12px inherit;cursor:pointer}.typing{display:none;align-items:center;gap:5px;width:69px;height:43px;padding:13px;border-radius:5px 14px 14px;background:var(--bubble)}.typing i{width:5px;height:5px;border-radius:50%;background:#9ba9bc;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.25;transform:translateY(-2px)}}
    .composer{flex:none;padding:10px 14px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.97)}.input-wrap{display:flex;align-items:flex-end;gap:8px;padding:5px 5px 5px 13px;border:1px solid #dce4ef;border-radius:22px;background:#f8fafc}#query{min-width:0;max-height:96px;flex:1;padding:7px 0;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:14px/1.45 inherit}.send{height:34px;padding:0 13px;border:0;border-radius:18px;background:#d9e5f9;color:#3976d2;font:13px inherit;cursor:pointer}.send.ready{background:var(--brand);color:#fff}
    .sheet-mask{display:none;position:absolute;z-index:10;inset:0;background:rgba(17,31,54,.26)}.sheet-mask.show{display:flex;align-items:flex-end}.sheet{width:100%;max-height:71%;padding:8px 18px 28px;border-radius:22px 22px 0 0;background:#fff;box-shadow:0 -8px 28px rgba(25,42,75,.12)}.handle{width:36px;height:4px;margin:0 auto 17px;border-radius:3px;background:#d8e0ea}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet h3{margin:0;font-size:17px}.close-sheet{border:0;background:transparent;color:#8290a5;font-size:25px;cursor:pointer}.doc-meta{margin:11px 0 15px;color:#8c9bb0;font-size:12px}.excerpt{margin:0;padding:13px;border-radius:12px;background:#f6f9fd;color:#465a78;font-size:13px;line-height:1.8}.excerpt mark{padding:1px 2px;background:#dceaff;color:#155acc}.full-doc{width:100%;height:42px;margin-top:17px;border:0;border-radius:11px;background:#176bff;color:#fff;font:14px inherit;cursor:pointer}.preview{display:none;position:absolute;z-index:12;inset:0;background:#fff}.preview.show{display:flex;flex-direction:column}.preview-body{flex:1;overflow:auto;padding:22px 20px}.preview-body h2{margin:0 0 9px;font-size:18px}.preview-body .doc-label{margin:0 0 22px;color:#8795a9;font-size:12px}.preview-body p{color:#3e506d;font-size:14px;line-height:1.85}#previewContent{white-space:pre-line}.toast{position:absolute;z-index:20;bottom:77px;left:50%;transform:translate(-50%,10px);padding:9px 13px;border-radius:18px;background:rgba(24,36,57,.91);color:#fff;opacity:0;pointer-events:none;white-space:nowrap;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.scenario-panel{display:none}}@media(max-width:480px){body{background:#fff}.demo-shell{display:block}.phone{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}.speaker{display:none}}
  </style>
</head>
<body>
  <div class="demo-shell">
    <aside class="scenario-panel" aria-label="演示场景控制">
      <h2>场景控制</h2><p>仅用于桌面演示；不会出现在手机产品内。</p>
      <button class="scenario-button" onclick="showNormal()">正常问答</button>
      <button class="scenario-button" onclick="showNoResult()">查询不到内容</button>
      <button class="scenario-button" onclick="showNetworkError()">网络连接异常</button>
      <button class="scenario-button" onclick="showServiceError()">服务暂时不可用</button>
    </aside>
    <main class="phone" aria-label="AI 知识库手机端演示">
      <div class="speaker"></div><div class="status"><span>9:41</span><span class="status-icons">▮▮▮ ◔ ▰</span></div>
      <header class="nav"><button class="icon-button" aria-label="返回" onclick="notify('返回上一页（演示）')">‹</button><h1>AI 知识库</h1><span></span></header>
      <section class="notice-area"><div class="notice-card"><div class="notice-icon">✦</div><div class="notice-copy"><b>知识库体验功能已开通</b><span>赠送 200MB 知识库存储空间和 50 次问答体验次数</span></div></div></section>
      <section class="content" id="content">
        <div class="welcome" id="welcome"></div>
        <div class="chat" id="chat"><p class="date">今天 09:41</p><div id="thread"></div><div class="message" id="typingRow"><span class="avatar">✦</span><div class="typing"><i></i><i></i><i></i></div></div></div>
      </section>
      <footer class="composer"><div class="input-wrap"><textarea id="query" rows="1" placeholder="请输入问题" oninput="setSendState();autoGrow(this)" onkeydown="handleKeydown(event)"></textarea><button class="send" id="send" onclick="submitQuery()">发送</button></div></footer>
      <div class="sheet-mask" id="sheetMask" onclick="if(event.target===this)closeSheet()"><section class="sheet"><div class="handle"></div><div class="sheet-head"><h3 id="sheetTitle"></h3><button class="close-sheet" onclick="closeSheet()">×</button></div><p class="doc-meta" id="sheetMeta"></p><p class="excerpt" id="sheetExcerpt"></p><button class="full-doc" onclick="openPreview()">查看源文件</button></section></div>
      <section class="preview" id="preview"><header class="nav"><button class="icon-button" onclick="closePreview()">‹</button><h1>源文件预览</h1><span></span></header><div class="preview-body"><h2 id="previewTitle"></h2><p class="doc-label" id="previewMeta"></p><p id="previewContent"></p></div></section>
      <div class="toast" id="toast"></div>
    </main>
  </div>
  <script>
    const query=document.getElementById('query'),thread=document.getElementById('thread'),content=document.getElementById('content');
    const answers={
      '会员投诉应该如何处理？':{title:'会员投诉处理可按以下步骤进行：',items:['当天完成投诉登记与初步回应；','根据问题类型和影响范围，确定处理负责人；','在规定时限内向会员同步处理进展与结果。'],doc:'门店会员投诉处理流程',fileName:'门店会员投诉处理流程.pdf',section:'场馆制度 · 第 2.1 节 · 投诉受理与分级处理',excerpt:'接到会员投诉后，应在当天完成登记与初步回应。<mark>涉及服务体验、费用争议等问题，应按投诉等级分配负责人，并在规定时限内向会员反馈处理进展。</mark>',full:'一、投诉受理\n\n接到会员投诉后，当天完成投诉登记与初步回应，并记录投诉时间、会员信息、问题描述及涉及人员。\n\n二、问题分级\n\n根据问题类型和影响范围确定投诉等级，并分配对应负责人处理。\n\n三、进展反馈与归档\n\n在规定时限内向会员同步处理进展与结果。处理完成后，归档登记记录及相关处理材料。'},
      '如何推荐合适的会员卡？':{title:'推荐会员卡时，先完成需求确认：',items:['了解会员的运动目标、到店频次和预算范围；','根据需求介绍对应的会员卡权益，不承诺未确认的资源；','记录顾虑后，再针对价格、时间和课程安排进行回应。'],doc:'销售顾问会员卡推荐话术',fileName:'销售顾问会员卡推荐话术.docx',section:'销售策略 · 第 1.2 节 · 需求沟通与方案推荐',excerpt:'沟通前先了解会员的目标、到店频次和预算。<mark>介绍会员卡时，应以已确认的权益为准，并记录会员的重点顾虑。</mark>',full:'一、需求确认\n\n沟通前了解会员的运动目标、到店频次与预算范围。\n\n二、方案介绍\n\n根据已确认的需求介绍对应会员卡权益，不承诺未确认的资源。\n\n三、顾虑回应\n\n记录会员对价格、时间和课程安排的顾虑，并按实际情况进行回应。'},
      '私教课怎样进行消课？':{title:'私教课消课前，需要确认以下事项：',items:['核对会员、教练和预约课程信息；','确认会员已到店并完成本次课程服务；','如有异常情况，按异常消课流程登记后再处理。'],doc:'私教课消课操作指引',fileName:'私教课消课操作指引.pdf',section:'平台操作说明 · 第 3.1 节 · 到店核销与异常消课',excerpt:'消课前需核对预约、会员和教练信息。<mark>如会员未到店或课程服务未完成，应按异常消课流程登记，不得直接操作消课。</mark>',full:'一、消课前核对\n\n核对会员、教练和预约课程信息，确认预约状态正确。\n\n二、课程服务确认\n\n确认会员已到店并完成本次课程服务后，再进行消课。\n\n三、异常消课\n\n如会员未到店或课程服务未完成，按异常消课流程登记后再处理。'}
    };
    let currentDoc=null,timer;
    function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,96)+'px'}
    function setSendState(){document.getElementById('send').classList.toggle('ready',!!query.value.trim())}
    function handleKeydown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitQuery()}}
    function submitQuery(){const text=query.value.trim();if(text) ask(text)}
    function setWelcome(type='normal'){const welcome=document.getElementById('welcome');if(type==='noFiles'){welcome.innerHTML='<h2>使用步骤</h2><div class="steps"><div class="step"><span class="step-number">1</span><div><b>上传文件</b><span>请联系场馆管理员前往电脑端上传知识库文件。</span><button class="manual-link" onclick="notify(\'已打开上传文件操作手册（演示）\')">查看操作手册</button></div></div><div class="step"><span class="step-number">2</span><div><b>发起问答</b><span>文件上传完成后，场馆工作人员即可在手机端输入问题并查询知识库内容。</span></div></div></div>';return}welcome.innerHTML=''}
    function resetChat(welcomeType='normal'){document.getElementById('chat').style.display='none';document.getElementById('typingRow').style.display='none';thread.innerHTML='';setWelcome(welcomeType);document.getElementById('welcome').style.display='flex';query.value='';query.style.height='auto';setSendState();content.scrollTop=0}
    function addUser(text){document.getElementById('welcome').style.display='none';document.getElementById('chat').style.display='block';thread.insertAdjacentHTML('beforeend',`<div class="message user"><div class="bubble">${escapeHtml(text)}</div><span class="avatar">我</span></div>`)}
    function ask(text){text=(text||'').trim();if(!text)return;addUser(text);query.value='';query.style.height='auto';setSendState();document.getElementById('typingRow').style.display='flex';content.scrollTop=content.scrollHeight;setTimeout(()=>renderAnswer(text),650)}
    function renderAnswer(text){document.getElementById('typingRow').style.display='none';const result=answers[text];if(!result){renderNoResult();return}currentDoc=result;thread.insertAdjacentHTML('beforeend',`<div class="message"><span class="avatar">✦</span><div class="answer"><div class="bubble"><p class="answer-title">${result.title}</p><ul>${result.items.map(item=>`<li>${item}</li>`).join('')}</ul><button class="source-card" onclick="openSheet()"><span class="source-icon">▤</span><span class="source-info"><b>${result.doc}</b><span>${result.section}</span></span><span class="chevron">›</span></button></div></div></div>`);content.scrollTop=content.scrollHeight}
    function renderNoResult(){thread.insertAdjacentHTML('beforeend','<div class="message"><span class="avatar">✦</span><div class="answer"><div class="bubble"><p class="answer-title">暂未找到相关内容</p><p>根据您的问题，暂未找到相关内容，请前往电脑端上传相关文件。</p></div></div></div>');content.scrollTop=content.scrollHeight}
    function renderError(title,message,retry){thread.insertAdjacentHTML('beforeend',`<div class="message"><span class="avatar">✦</span><div class="answer"><div class="bubble"><p class="answer-title">${title}</p><p>${message}</p></div><div class="follow"><button onclick="${retry}">重试</button></div></div></div>`);content.scrollTop=content.scrollHeight}
    function showNormal(){resetChat();ask('会员投诉应该如何处理？')}
    function showNoResult(){resetChat();addUser('如何申请场馆停车优惠？');renderNoResult()}
    function showNetworkError(){resetChat();addUser('会员投诉应该如何处理？');renderError('网络连接异常','请检查网络后重试。','retryNetwork()')}
    function retryNetwork(){thread.lastElementChild.remove();ask('会员投诉应该如何处理？')}
    function showServiceError(){resetChat();addUser('会员投诉应该如何处理？');renderError('服务暂时不可用','请稍后重试。','retryService()')}
    function retryService(){thread.lastElementChild.remove();ask('会员投诉应该如何处理？')}
    function openSheet(){if(!currentDoc)return;sheetTitle.textContent=currentDoc.doc;sheetMeta.textContent=currentDoc.section;sheetExcerpt.innerHTML=currentDoc.excerpt;sheetMask.classList.add('show')}
    function closeSheet(){sheetMask.classList.remove('show')}
    function openPreview(){closeSheet();previewTitle.textContent=currentDoc.fileName;previewMeta.textContent='用户上传文件 · '+currentDoc.doc;previewContent.textContent=currentDoc.full;preview.classList.add('show')}
    function closePreview(){preview.classList.remove('show')}
    function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function notify(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800)}
    setWelcome('noFiles');
  </script>
</body>
</html>
