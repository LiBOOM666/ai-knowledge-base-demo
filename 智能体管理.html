<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能体管理</title>
<style>
:root{--primary:#18a996;--text:#2f3b52;--muted:#758195;--line:#e7edf3;--bg:#f1f4f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #93ddd3;outline-offset:4px}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px}.topbar h1{margin:0;font-size:18px;font-weight:600}main{max-width:1600px;margin:auto;padding:28px 32px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;min-height:340px;overflow:hidden}.card{cursor:pointer}.card:focus-visible{outline:3px solid #93ddd3;outline-offset:3px}.card-top{height:6px;background:var(--accent)}.card-body{padding:28px 26px 24px;flex:1}.card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.symbol{width:54px;height:54px;border-radius:12px;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-size:23px;font-weight:600}.status{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;color:var(--primary);background:#eefaf7;border:1px solid #d0eee6;padding:4px 9px;border-radius:4px}.status:before{content:"";height:6px;width:6px;border-radius:50%;background:currentColor}.status.off{color:#8792a3;background:#f5f6f8;border-color:#e7ebf0}.card h2{font-size:20px;margin:23px 0 12px;letter-spacing:.2px}.description{font-size:14px;color:var(--muted);line-height:1.9;margin:0;white-space:pre-line}.card-footer{padding:18px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.detail-link{background:none;border:0;padding:4px 0;color:var(--primary)}.detail-link span{margin-left:8px}.button{border:1px solid #dce4ec;background:white;color:var(--text);border-radius:20px;min-height:34px;padding:6px 20px}.button:hover{background:#f8fafb}.button.primary{background:#29c7b1;border-color:#29c7b1;color:white}.button.primary:hover{background:#18b9a4}.button.disable-action{color:#d94b4b;border-color:#f0aaaa;background:#fff1f1}.button.disable-action:hover{color:#c63838;border-color:#e88787;background:#ffe3e3}.button.danger{background:#f05b5b;border-color:#f05b5b;color:white}.overlay{position:fixed;inset:0;background:rgba(31,42,58,.36);display:flex;justify-content:flex-end;z-index:10}.overlay[hidden]{display:none}.drawer{background:white;width:540px;max-width:100%;height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 30px #2f3b5214}.drawer-head{min-height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line)}.drawer-head h2{font-size:17px;margin:0}.close{border:0;background:none;font-size:25px;color:var(--muted);padding:6px 9px}.drawer-content{padding:30px 28px;overflow:auto;flex:1}.detail-heading{display:flex;align-items:center;gap:16px;margin-bottom:32px}.detail-heading h3{font-size:21px;margin:0 0 9px}.section{margin:0 0 29px}.section h4{font-size:14px;margin:0 0 12px}.section p,.section li{color:#677489;line-height:1.9;white-space:pre-line}.section p{margin:0}.section ul{margin:0;padding-left:20px}.section li+li{margin-top:10px}.drawer-footer{border-top:1px solid var(--line);padding:18px 28px;text-align:right}.confirm-overlay{z-index:20;align-items:center;justify-content:center;padding:20px}.confirm{width:460px;max-width:100%;background:white;box-shadow:0 10px 30px #2f3b521f}.confirm h2{font-size:17px;margin:0;padding:23px 24px 0}.confirm p{padding:0 24px;line-height:1.9;color:#677489;margin:16px 0 24px;white-space:pre-line}.confirm-actions{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end}.toast{position:fixed;z-index:30;top:84px;left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:5px;color:white;background:#2f3beF}.toast{background:#2f3b52;box-shadow:0 10px 30px #2f3b521f}.toast[hidden]{display:none}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.topbar{padding:0 20px}main{padding:20px 16px}.grid{grid-template-columns:1fr;gap:18px}.card{min-height:310px}.drawer-head,.drawer-content,.drawer-footer{padding-left:22px;padding-right:22px}}
.module-banner{min-height:244px;margin-bottom:28px;position:relative;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:32px 40px;overflow:hidden;background:linear-gradient(110deg,#e4f5f0 0%,#edf5fa 65%,#eceffd 100%);border:1px solid #dfebe9}.banner-copy{position:relative;z-index:1;max-width:690px}.banner-eyebrow{color:#228e80;font-size:13px;letter-spacing:2px}.banner-copy h2{font-size:28px;line-height:1.5;margin:12px 0;color:#28483f;font-weight:600}.banner-copy p{font-size:14px;line-height:1.9;color:#627c78;margin:0}.banner-image{width:320px;height:194px;object-fit:contain;flex-shrink:0}@media(max-width:1050px){.module-banner{padding:28px}.banner-image{width:230px}.banner-copy h2{font-size:24px}}@media(max-width:680px){.module-banner{padding:25px 22px;min-height:0;margin-bottom:20px;display:block}.banner-copy h2{font-size:23px}.banner-copy p br{display:none}.banner-image{display:block;width:210px;height:130px;margin:16px auto -5px}}
.usage-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:16px}.usage-heading h4{margin:0}.manual-link{border:0;background:none;padding:0;color:var(--primary);text-decoration:underline;text-underline-offset:3px;font-size:13px}.usage-step{display:flex;gap:12px;margin-bottom:18px}.step-number{flex:none;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:#e8f1ff;color:#61799b;font-size:12px}.step-copy h5{font-size:14px;margin:0 0 4px}.step-copy p{font-size:13px;color:#677489;line-height:1.7}
</style>
</head>
<body>
<header class="topbar"><h1>智能体管理</h1></header>
<main><section class="module-banner" aria-labelledby="bannerTitle"><div class="banner-copy"><span class="banner-eyebrow">让 Ai 助力工作提效</span><h2 id="bannerTitle">菠菜智能体应用广场</h2><p>点击“查看详情”了解各个智能体的能力与适用场景，按需启用。</p></div><img class="banner-image" src="智能体管理-横幅.svg" alt="知识、销售与运营能力围绕智能体连接的示意图"></section><div class="grid" id="agentGrid" aria-label="智能体列表"></div></main>
<div class="overlay" id="detailOverlay" hidden><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><header class="drawer-head"><h2 id="detailTitle">智能体详情</h2><button class="close" id="closeDetail" aria-label="关闭详情">×</button></header><div class="drawer-content" id="detailContent"></div><footer class="drawer-footer"><button class="button primary" id="openManual">操作手册</button></footer></aside></div>
<div class="overlay confirm-overlay" id="confirmOverlay" hidden><section class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText"><h2 id="confirmTitle">停用智能体</h2><p id="confirmText"></p><div class="confirm-actions"><button class="button" id="cancelDisable">取消</button><button class="button danger" id="confirmDisable">确认停用</button></div></section></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const agents=[
{id:'knowledge',name:'知识库问答助手',symbol:'知',enabled:false,accent:'#18a996',tint:'#e8f8f4',summary:'基于知识库资料解答业务问题，\n帮助员工快速找到准确的信息与依据。',intro:'根据用户提问检索知识库资料，整理相关内容并给出回答。\n支持查看回答引用的资料，方便进一步核对。',abilities:[{title:'新人培训少些重复讲解',description:'将员工手册、岗位职责和操作指南放入知识库，新人遇到问题随时查询，减少重复答疑。'},{title:'门店执行有统一依据',description:'集中提供服务标准、巡检要求和应急预案，员工按需查阅，让日常执行有章可循。'},{title:'运营经验留下来、用起来',description:'将运营方案、培训材料和经验总结集中沉淀，方便员工查找和复用，减少对个人记忆的依赖。'}],scene:'员工查询制度规范、业务流程、产品信息及常见问题。'},
];
const guides={
knowledge:[['启用智能体','在应用广场找到知识库问答助手，点击“启用”。'],['进入对话','在用户端进入知识库问答助手的对话界面。'],['输入问题','描述需要查询的问题，并发送。'],['核对回答','阅读回答，并查看引用资料以核对具体内容。']],
};
const $=id=>document.getElementById(id);let detailId=null,pendingId=null,returnFocus=null,timer;
const status=a=>`<span class="status ${a.enabled?'':'off'}">${a.enabled?'启用':'未启用'}</span>`;
function render(){ $('agentGrid').innerHTML=agents.map(a=>`<article class="card" data-card="${a.id}" tabindex="0" aria-label="${a.name}，点击查看详情" style="--accent:${a.accent};--tint:${a.tint}"><div class="card-top"></div><div class="card-body"><div class="card-heading"><div class="symbol" aria-hidden="true">${a.symbol}</div>${status(a)}</div><h2>${a.name}</h2><p class="description">${a.summary}</p></div><footer class="card-footer"><button class="detail-link" data-detail="${a.id}" aria-label="查看${a.name}详情">查看详情<span aria-hidden="true">→</span></button><button class="button ${a.enabled?'disable-action':'primary'}" data-toggle="${a.id}" aria-label="${a.enabled?'停用':'启用'}${a.name}">${a.enabled?'停用':'启用'}</button></footer></article>`).join(''); }
function showToast(message){clearTimeout(timer);$('toast').textContent=message;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,2400)}
function lock(){document.body.style.overflow=(!$('detailOverlay').hidden||!$('confirmOverlay').hidden)?'hidden':''}
function openDetail(id){detailId=id;returnFocus=document.activeElement;const a=agents.find(a=>a.id===id);$('detailContent').innerHTML=`<div class="detail-heading"><div class="symbol" style="--accent:${a.accent};--tint:${a.tint}" aria-hidden="true">${a.symbol}</div><div><h3>${a.name}</h3>${status(a)}</div></div><section class="section"><h4>智能体介绍</h4><p>${a.intro}</p></section><section class="section"><h4>能力清单</h4><ul>${a.abilities.map(x=>typeof x==='string'?`<li>${x}</li>`:`<li><strong style="color:var(--text)">${x.title}</strong><p>${x.description}</p></li>`).join('')}</ul></section>${a.id==='knowledge'?`<section class="section"><div class="usage-heading"><h4>使用步骤</h4></div><div class="usage-step"><span class="step-number">1</span><div class="step-copy"><h5>启用智能体</h5><p>前往 Web 端开启智能体。</p></div></div><div class="usage-step"><span class="step-number">2</span><div class="step-copy"><h5>管理员上传资料</h5><p>在电脑端上传各类规范文件。</p></div></div><div class="usage-step"><span class="step-number">3</span><div class="step-copy"><h5>员工直接提问</h5><p>打开手机端，输入问题，获得 ai 回复。</p></div></div></section>`:`<section class="section"><h4>操作步骤</h4><ol>${guides[a.id].map(step=>`<li><strong>${step[0]}</strong><br>${step[1]}</li>`).join('')}</ol></section>`}`;$('detailOverlay').hidden=false;lock();$('closeDetail').focus()}
function closeDetail(){$('detailOverlay').hidden=true;detailId=null;lock();returnFocus?.focus()}
function closeConfirm(){$('confirmOverlay').hidden=true;const id=pendingId;pendingId=null;lock();document.querySelector(`[data-toggle="${id}"]`)?.focus()}
$('agentGrid').addEventListener('click',e=>{const detail=e.target.closest('[data-detail]');if(detail){openDetail(detail.dataset.detail);return}const toggle=e.target.closest('[data-toggle]');if(!toggle){const card=e.target.closest('[data-card]');if(card)openDetail(card.dataset.card);return;}const a=agents.find(a=>a.id===toggle.dataset.toggle);if(!a.enabled){a.enabled=true;render();document.querySelector(`[data-toggle="${a.id}"]`).focus();showToast(`${a.name}已启用`)}else{pendingId=a.id;$('confirmText').textContent=`确定停用「${a.name}」吗？\n停用后，用户端将无法使用该智能体。`;$('confirmOverlay').hidden=false;lock();$('cancelDisable').focus()}});
$('agentGrid').addEventListener('keydown',e=>{if(e.target.matches('[data-card]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDetail(e.target.dataset.card)}});
$('confirmDisable').onclick=()=>{const a=agents.find(a=>a.id===pendingId);a.enabled=false;render();closeConfirm();showToast(`${a.name}已停用`)};
const manualUrl=''; // 待填入语雀公开文档链接
$('openManual').onclick=()=>{if(!manualUrl){showToast('操作手册链接待配置');return}window.open(manualUrl,'_blank','noopener,noreferrer')};
$('cancelDisable').onclick=closeConfirm;$('closeDetail').onclick=closeDetail;
$('detailOverlay').onclick=e=>{if(e.target===$('detailOverlay'))closeDetail()};$('confirmOverlay').onclick=e=>{if(e.target===$('confirmOverlay'))closeConfirm()};
document.addEventListener('keydown',e=>{const overlay=!$('confirmOverlay').hidden?$('confirmOverlay'):!$('detailOverlay').hidden?$('detailOverlay'):null;if(!overlay)return;if(e.key==='Escape'){overlay===$('confirmOverlay')?closeConfirm():closeDetail()}if(e.key==='Tab'){const buttons=[...overlay.querySelectorAll('button')];const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script>
</body>
</html>
