<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>菠菜 ai · 智能体管理</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;color:#2f3b52;font:14px "PingFang SC","Microsoft YaHei",sans-serif;background:#f1f4f7}.sidebar{width:208px;flex-shrink:0;background:#fff;border-right:1px solid #e7edf3;display:flex;flex-direction:column}.brand{height:68px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid #e7edf3;font-size:20px;font-weight:650;gap:10px}.brand-mark{width:28px;height:28px;background:#29c7b1;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:18px}nav{padding:20px 12px}button,a{-webkit-tap-highlight-color:transparent}.group{width:100%;height:44px;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:0 14px;font:600 15px "PingFang SC","Microsoft YaHei",sans-serif;color:#2f3b52;cursor:pointer}.group-icon{color:#18a996;font-size:18px}.arrow{margin-left:auto;font-size:12px;transition:transform .2s}.group[aria-expanded="false"] .arrow{transform:rotate(-90deg)}.routes{display:grid;gap:6px;margin-top:6px}.routes[hidden]{display:none}.routes a{height:44px;display:flex;align-items:center;margin:0;padding:0 0 0 44px;text-decoration:none;color:#758195;border-radius:5px;position:relative}.routes a:hover{background:#f4f9f8;color:#18a996}.routes a.active{background:#eaf9f5;color:#18a996;font-weight:600}.routes a.active:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;background:#29c7b1;border-radius:2px}a:focus-visible,button:focus-visible{outline:2px solid #29c7b1;outline-offset:2px}.content{flex:1;min-width:0;height:100%;position:relative}iframe{display:block;width:100%;height:100%;border:0;background:#f1f4f7}@media(max-width:800px){.sidebar{width:168px}.brand{padding:0 18px}.routes a{padding-left:32px}nav{padding:16px 8px}}
</style>
</head>
<body>
<aside class="sidebar">
<div class="brand"><span class="brand-mark" aria-hidden="true">菠</span><span>菠菜</span></div>
<nav aria-label="主导航">
<button class="group" id="group" aria-expanded="true" aria-controls="routes"><span class="group-icon" aria-hidden="true">✧</span><span>菠菜 ai</span><span class="arrow" aria-hidden="true">⌄</span></button>
<div class="routes" id="routes">
<a href="#/spinach-ai/agents" data-route="agents">智能体管理</a>
<a href="#/spinach-ai/knowledge" data-route="knowledge">知识库管理</a>
<a href="#/spinach-ai/usage" data-route="usage">用量记录</a>
</div>
</nav>
</aside>
<main class="content"><iframe id="demo" title="智能体管理" src="智能体管理.html"></iframe></main>
<script>
const pages={agents:{title:'智能体管理',file:'智能体管理.html'},knowledge:{title:'知识库管理',file:'知识库管理.html?v=69da43a'},usage:{title:'用量记录',file:'智能体用量详情.html'}};
const frame=document.getElementById('demo');
function render(){let key=location.hash.split('/')[2];if(!pages[key]){location.replace('#/spinach-ai/agents');return}const page=pages[key];document.querySelectorAll('[data-route]').forEach(link=>{const active=link.dataset.route===key;link.classList.toggle('active',active);if(active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});if(frame.getAttribute('src')!==page.file)frame.src=page.file;frame.title=page.title;document.title='菠菜 ai · '+page.title}
document.getElementById('group').addEventListener('click',function(){const expanded=this.getAttribute('aria-expanded')==='true';this.setAttribute('aria-expanded',String(!expanded));document.getElementById('routes').hidden=expanded});
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
