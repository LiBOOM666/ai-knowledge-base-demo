<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 知识库 - 文档管理</title>
  <style>
    :root { --main:#29c7b1; --main-dark:#18a996; --text:#2f3b52; --muted:#758195; --line:#e7edf3; --bg:#f1f4f7; --danger:#f05b5b; --warn:#e6a23c; --info:#4d8af0; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:1240px; background:var(--bg); color:var(--text); font:14px "PingFang SC","Microsoft YaHei",sans-serif; }
    .topbar { height:68px; padding:0 32px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    .topbar h1 { margin:0; font-size:18px; letter-spacing:.2px; }
    .account { color:var(--muted); font-size:13px; display:flex; gap:10px; align-items:center; }
    .avatar { width:28px; height:28px; border-radius:50%; background:#e2f7f3; color:var(--main-dark); display:grid; place-items:center; font-weight:700; }
    main { padding:16px; }
    .actionbar, .panel { background:#fff; border:1px solid var(--line); }
    .actionbar { height:62px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
    .tabs { height:100%; display:flex; align-items:center; gap:28px; }
    .tab { height:100%; display:flex; align-items:center; font-size:15px; color:var(--main-dark); font-weight:700; border-bottom:2px solid var(--main); }
    button { cursor:pointer; font:inherit; border-radius:18px; height:34px; padding:0 18px; border:1px solid var(--main); color:var(--main-dark); background:#fff; }
    button:hover { filter:brightness(.98); }
    button.primary { background:var(--main); color:#fff; }
    button.weak { border-color:transparent; color:var(--muted); }
    button.small { min-width:72px; height:30px; padding:0 13px; font-size:13px; border-radius:15px; }
    button:disabled { cursor:not-allowed; background:#f3f5f7; color:#a9b3c0; border-color:#e7edf3; }
    .panel { margin-top:14px; }
    .filters { padding:20px 16px 14px; min-height:120px; }
    .filter-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .field { display:flex; align-items:center; gap:8px; }
    .field label { white-space:nowrap; color:#4d5970; }
    input[type="text"], input[type="date"], select { height:34px; border:1px solid #dce4ec; border-radius:17px; padding:0 13px; outline:0; background:#fff; color:var(--text); }
    input[type="text"] { width:300px; }
    select { min-width:138px; }
    input:focus, select:focus { border-color:var(--main); box-shadow:0 0 0 3px rgba(41,199,177,.12); }
    .filter-actions { margin-left:4px; display:flex; gap:6px; }
    .table-wrap { overflow:auto; border-top:1px solid var(--line); }
    table { width:100%; min-width:1360px; border-collapse:collapse; table-layout:fixed; }
    th, td { height:50px; padding:0 16px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
    th { background:#fbfcfe; font-weight:700; color:#3d4b63; }
    th:last-child, td:last-child { border-right:0; }
    th.name { width:350px; } th.size { width:120px; } th.status-col { width:180px; } th.operator { width:180px; } th.time { width:240px; } th.actions { width:270px; }
    .status { display:inline-flex; align-items:center; height:22px; padding:0 8px; border:1px solid; border-radius:4px; font-size:12px; }
    .ready { color:var(--main-dark); background:#effbf9; border-color:#baeade; }.processing { color:var(--info); background:#f0f5ff; border-color:#cbdcff; }.duplicate { color:#be7c16; background:#fff8ea; border-color:#f4ddb1; }.failed { color:var(--danger); background:#fff1f1; border-color:#ffcaca; }
    .link, .text-action { color:var(--main-dark); background:none; border:0; padding:0; height:auto; min-width:0; border-radius:0; font-size:13px; }
    .text-action.danger, .text-action.retry { color:var(--danger); }.text-action.muted:disabled { background:transparent; border:0; color:#a9b3c0; cursor:not-allowed; }.action-sep { color:#d4dbe4; margin:0 7px; }
    .pagination { height:58px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; color:var(--muted); }
    .capacity-summary, .pagination-controls { display:flex; align-items:center; gap:10px; }.capacity-summary { font-size:13px; }.capacity-summary strong { color:var(--text); font-weight:600; }.capacity-track { width:120px; height:6px; overflow:hidden; border-radius:3px; background:#e8eef2; }.capacity-value { display:block; width:0; height:100%; border-radius:3px; background:var(--main); transition:width .2s; }.pagination-controls { gap:10px; }
    .page { width:28px; height:28px; display:grid; place-items:center; border:1px solid #dce4ec; color:var(--main-dark); border-radius:3px; }.page.active { background:var(--main); border-color:var(--main); color:#fff; }
    .modal-mask { display:none; position:fixed; inset:0; z-index:10; background:rgba(31,42,58,.36); align-items:center; justify-content:center; }
    .modal-mask.show { display:flex; }.modal { width:640px; max-height:80vh; background:#fff; box-shadow:0 10px 30px rgba(47,59,82,.12); display:flex; flex-direction:column; }
    .modal-head { height:54px; padding:0 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; font-size:16px; font-weight:700; }.close { border:0; padding:0; width:30px; min-width:30px; background:transparent; color:var(--muted); font-size:23px; }
    .modal-body { overflow:auto; padding:18px 20px; }.modal-foot { min-height:58px; padding:12px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }
    .upload-zone { border:1px dashed #a8dcd4; background:#f5fcfb; padding:22px; text-align:center; color:var(--muted); }.upload-file-status { min-height:20px; margin:8px 0 18px; display:flex; align-items:center; gap:10px; font-size:13px; }.upload-file-status.success { color:var(--main-dark); }.upload-file-status.failure { color:var(--danger); }.upload-select { padding:0; height:auto; min-width:0; border:0; border-radius:0; background:transparent; color:var(--main-dark); }.form-item { margin:0 0 16px; }.form-item label { display:block; margin-bottom:7px; color:#4d5970; }.required { color:var(--danger); margin-right:4px; }.form-item input, .form-item select { width:100%; border-radius:4px; }.upload-stack { display:flex; flex-direction:column; align-items:center; }.upload-simulation { width:640px; margin-top:14px; padding:14px 20px; background:rgba(255,255,255,.86); border:1px solid rgba(255,255,255,.72); box-shadow:0 10px 30px rgba(47,59,82,.1); }.scenario-title { margin:0 0 10px; color:#66738a; font-size:13px; }.scenario-buttons { display:flex; gap:8px; flex-wrap:wrap; }.scenario-button { height:30px; padding:0 13px; border-color:#dce4ec; color:#66738a; font-size:13px; }.scenario-button.active { border-color:var(--main); background:#effbf9; color:var(--main-dark); }.field-error { border-color:var(--danger)!important; box-shadow:0 0 0 3px rgba(240,91,91,.1); }.progress-modal { width:480px; }.progress-text { margin:4px 0 18px; color:var(--muted); }.progress-track { height:8px; background:#edf1f5; border-radius:4px; overflow:hidden; }.progress-value { width:0; height:100%; background:var(--main); border-radius:4px; transition:width .2s; }.progress-number { margin-top:10px; text-align:right; color:var(--main-dark); font-size:13px; }.result-icon { width:42px; height:42px; margin:5px auto 14px; border-radius:50%; display:grid; place-items:center; font-size:22px; }.result-icon.error { background:#fff1f1; color:var(--danger); }.result-message { text-align:center; color:#566278; line-height:1.7; }.toast { display:none; position:fixed; z-index:20; top:82px; left:50%; transform:translateX(-50%); padding:10px 18px; background:rgba(47,59,82,.93); color:#fff; border-radius:4px; box-shadow:0 8px 18px rgba(47,59,82,.16); }
    .workspace { display:flex; gap:14px; margin-top:14px; align-items:stretch; }
    .library-sidebar { width:224px; flex-shrink:0; background:#fff; border:1px solid var(--line); padding:16px 10px; }
    .library-head { display:flex; align-items:center; justify-content:space-between; padding:0 6px 16px; font-weight:600; }
    .library-item { width:100%; display:flex; align-items:center; justify-content:space-between; border:0; border-radius:4px; height:44px; padding:0 12px; color:var(--text); margin-bottom:5px; text-align:left; }
    .library-item.active { background:#eaf9f6; color:var(--main-dark); font-weight:600; }
    .library-count { color:var(--muted); font-size:12px; font-weight:400; }
    .workspace .panel { margin-top:0; flex:1; min-width:0; }
    .library-context { padding:18px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    .library-context strong { font-size:16px; }
    .filters { min-height:0; padding-bottom:18px; }
    table { min-width:1160px; }
    th.name { width:260px; } th.library-col { width:170px; } th.size { width:100px; } th.status-col { width:110px; } th.operator { width:110px; } th.time { width:180px; } th.actions { width:230px; }
    .pagination { gap:18px; flex-wrap:wrap; height:auto; min-height:68px; padding:16px; }
    /* 工作区占满剩余视口，列表独立滚动，容量与分页始终置底。 */
    main { height:calc(100dvh - 68px); min-height:460px; display:flex; flex-direction:column; }
    .actionbar { flex-shrink:0; }
    .workspace { flex:1; min-height:0; }
    .library-sidebar { align-self:stretch; height:100%; min-height:0; display:flex; flex-direction:column; }
    .library-head { flex-shrink:0; }
    #libraryNav { flex:1; min-height:0; overflow-y:auto; }
    .library-sidebar .capacity-summary { margin:16px 6px 0; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap; gap:10px 4px; flex-shrink:0; }
    .library-sidebar .capacity-track { order:1; width:100%; }
    .capacity-help { position:relative; margin-left:auto; display:inline-flex; }
    .capacity-help-button { display:grid; place-items:center; width:16px; min-width:16px; height:16px; padding:0; border:1px solid #98a5b6; border-radius:50%; background:#fff; color:var(--muted); font-size:11px; cursor:help; }
    .capacity-tooltip { display:none; position:absolute; bottom:calc(100% + 9px); left:0; z-index:5; width:max-content; max-width:260px; padding:9px 12px; border-radius:4px; background:#2f3b52; color:#fff; font-size:12px; line-height:1.6; box-shadow:0 4px 12px rgba(47,59,82,.16); pointer-events:none; }
    .capacity-help:hover .capacity-tooltip, .capacity-help:focus-within .capacity-tooltip { display:block; }
    .workspace .panel { display:flex; flex-direction:column; min-height:0; }
    .library-context, .filters { flex-shrink:0; }
    .workspace .table-wrap { flex:1; min-height:0; overflow:auto; }
    .workspace .pagination { justify-content:space-between; flex-shrink:0; border-top:1px solid var(--line); background:#fff; }
    .library-item:disabled { background:#f5f6f8; color:#a9b3c0; cursor:not-allowed; }
    .library-item:disabled .library-count { color:#a9b3c0; }
    .batch-actions { display:flex; align-items:center; gap:10px; white-space:nowrap; }
    .name-selection { display:flex; align-items:center; gap:10px; min-width:0; cursor:pointer; }
    .name-selection input { flex-shrink:0; margin:0; }
    .name-selection span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    input[type="checkbox"] { accent-color:var(--main); cursor:pointer; }
    .batch-actions .delete-button { border-color:var(--danger); color:var(--danger); }
    .batch-actions .delete-button:disabled { border-color:#e7edf3; color:#a9b3c0; }
    .move-library-list { display:flex; flex-direction:column; gap:10px; }
    .form-item .move-library-option { display:flex; align-items:center; gap:10px; margin:0; padding:12px 14px; border:1px solid var(--line); border-radius:4px; cursor:pointer; }
    .move-library-option:has(input:checked) { border-color:var(--main); background:#effbf9; }
    .form-item .move-library-option input { width:16px; height:16px; margin:0; accent-color:var(--main); flex-shrink:0; }
  </style>
</head>
<body>
  <header class="topbar"><h1>AI 知识库</h1><div class="account"><span>知识库管理员</span><span class="avatar">管</span></div></header>
  <main>
    <section class="actionbar"><div class="tabs"><div class="tab">知识库管理</div></div><button class="primary" onclick="openUpload()">上传文件</button></section>
    <div class="workspace">
    <aside class="library-sidebar"><div class="library-head"><span>知识库分类</span></div><nav id="libraryNav" aria-label="知识库分类"></nav><div class="capacity-summary"><span>已用空间：</span><span class="capacity-track" id="capacityTrack" role="progressbar" aria-label="已用空间" aria-valuemin="0" aria-valuemax="200" aria-valuenow="0"><i class="capacity-value" id="capacityValue"></i></span><span>200 M</span><span class="capacity-help"><button type="button" class="capacity-help-button" aria-label="空间扩容说明" aria-describedby="capacityTooltip">?</button><span class="capacity-tooltip" id="capacityTooltip" role="tooltip">场馆内所有知识库共用一个空间<br>如需空间扩容请联系菠菜客服</span></span></div></aside>
    <section class="panel">
      <div class="library-context"><strong id="currentLibraryTitle">通用知识库</strong></div>
      <div class="filters"><div class="filter-row">
        <div class="field"><label for="keyword">文档名称</label><input id="keyword" type="text" placeholder="请输入文档名称" oninput="render()"></div>
        <div class="field"><label for="status">状态</label><select id="status" onchange="render()"><option value="">全部</option><option>正常</option><option>解析中</option><option>解析失败</option></select></div>
        <div class="field"><label for="uploader">上传人</label><input id="uploader" type="text" placeholder="请输入上传人" oninput="render()" style="width:150px"></div>
        <div class="field"><label for="uploadStartDate">上传时间</label><input id="uploadStartDate" type="date" aria-label="上传开始日期" onchange="updateDateRange()"><span>至</span><input id="uploadEndDate" type="date" aria-label="上传结束日期" onchange="updateDateRange()"></div>
        <div class="filter-actions"><button class="small primary" onclick="render()">查询</button><button class="small weak" onclick="resetFilters()">重置</button></div>
      </div></div>
      <div class="table-wrap"><table><thead><tr><th class="name"><label class="name-selection"><input type="checkbox" id="selectAllDocs" aria-label="全选当前列表文档" onchange="toggleAllDocs(this.checked)"><span>文档名称</span></label></th><th class="library-col">所属知识库</th><th class="size">文件大小</th><th class="status-col">状态</th><th class="operator">上传人</th><th class="time">上传时间</th><th class="actions">操作</th></tr></thead><tbody id="documentRows"></tbody></table></div>
      <div class="pagination"><div class="batch-actions"><span>批量操作：</span><button class="small" id="batchMove" onclick="openBatchMove()" disabled>移动</button><button class="small delete-button" id="batchDelete" onclick="deleteSelectedDocs()" disabled>删除</button><button class="small" id="batchRetry" onclick="retrySelectedDocs()" disabled>重试</button></div><div class="pagination-controls"><span id="total">共 0 条</span><span>每页 10 条</span><span class="page active">1</span></div></div>
    </section>
    </div>
  </main>
  <div class="modal-mask" id="uploadModal"><div class="upload-stack"><div class="modal"><div class="modal-head"><span>上传文件</span><button class="close" onclick="closeModal('uploadModal')">×</button></div><div class="modal-body">
    <div class="upload-zone" id="uploadZone"><button class="upload-select" type="button" onclick="mockSelectFile()"><span class="required">*</span>点击选择文件</button><p>支持上传制度、策略和操作说明文件</p></div>
    <div class="upload-file-status" id="fileStatus" aria-live="polite"></div>
    <div class="form-item"><label for="uploadLibrary"><span class="required">*</span>所属知识库</label><select id="uploadLibrary" onchange="this.classList.remove('field-error')"></select></div>
    <div class="form-item"><label><span class="required">*</span>文档名称</label><input id="uploadName" type="text" placeholder="请输入文档名称" oninput="clearUploadError()"></div>
  </div><div class="modal-foot"><button onclick="closeModal('uploadModal')">取消</button><button class="primary" onclick="uploadDocument()">上传</button></div></div><section class="upload-simulation"><p class="scenario-title">场景模拟</p><div class="scenario-buttons"><button class="scenario-button" type="button" onclick="simulateUploadSuccess()">上传成功</button><button class="scenario-button" type="button" onclick="simulateUploadFailure()">上传失败</button><button class="scenario-button" type="button" data-scenario="missing" onclick="selectScenario('missing')">信息未填</button><button class="scenario-button" type="button" data-scenario="failure" onclick="selectScenario('failure')">提取文字失败</button><button class="scenario-button" type="button" data-scenario="duplicate" onclick="selectScenario('duplicate')">内容重复</button><button class="scenario-button active" type="button" data-scenario="normal" onclick="selectScenario('normal')">正常提取</button></div></section></div></div>
  <div class="modal-mask" id="progressModal"><div class="modal progress-modal"><div class="modal-head"><span>内容提取</span></div><div class="modal-body"><p class="progress-text">正在提取文件内容，请稍候…</p><div class="progress-track"><div class="progress-value" id="progressValue"></div></div><div class="progress-number" id="progressNumber">0%</div></div></div></div>
  <div class="modal-mask" id="resultModal"><div class="modal" style="width:480px"><div class="modal-head"><span id="resultTitle">提取失败</span><button class="close" onclick="closeModal('resultModal')">×</button></div><div class="modal-body"><div class="result-icon error">!</div><div class="result-message" id="resultMessage"></div></div><div class="modal-foot" id="resultFooter"><button class="primary" onclick="closeModal('resultModal')">我知道了</button></div></div></div>
  <div class="modal-mask" id="moveModal"><div class="modal" style="width:480px"><div class="modal-head"><span>移动文档</span><button class="close" onclick="closeModal('moveModal')">×</button></div><div class="modal-body"><div class="form-item"><label id="moveLibraryLabel">所属知识库</label><div id="moveLibrary" class="move-library-list" role="radiogroup" aria-labelledby="moveLibraryLabel"></div></div></div><div class="modal-foot"><button onclick="closeModal('moveModal')">取消</button><button class="primary" onclick="saveMove()">确定</button></div></div></div>
  <div id="toast" class="toast"></div>
  <script>
    const libraries = [{id:'sales',name:'通用知识库'},{id:'operations',name:'销售话术知识库'},{id:'coaching',name:'教练培训知识库'}];
    let activeLibrary=libraries[0].id, movingDocId=null, movingDocIds=[];
    const selectedDocIds=new Set();
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const libraryNameOf = id => libraries.find(x=>x.id===id)?.name || '';
    function libraryOptions(selected,placeholder=false){ return (placeholder?'<option value="">请选择所属知识库</option>':'')+libraries.filter(x=>x.enabled!==false).map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${escapeHtml(x.name)}</option>`).join(''); }
    function renderLibraries(){ libraryNav.innerHTML=libraries.map(x=>`<button class="library-item ${activeLibrary===x.id?'active':''}" ${x.enabled===false?'disabled title="功能未开通"':`onclick="selectLibrary('${x.id}')"`} ${activeLibrary===x.id?'aria-current="true"':''}><span>${escapeHtml(x.name)}</span><span class="library-count">${x.enabled===false?'未开通':docs.filter(d=>d.library===x.id).length}</span></button>`).join(''); currentLibraryTitle.textContent=libraryNameOf(activeLibrary); }
    function selectLibrary(id){ if(!libraries.some(x=>x.id===id&&x.enabled!==false)) return; activeLibrary=id; resetFilters(); }
    function renderMoveLibraries(selected){ moveLibrary.innerHTML=libraries.filter(x=>x.enabled!==false).map(x=>`<label class="move-library-option"><input type="radio" name="moveTargetLibrary" value="${x.id}" ${x.id===selected?'checked':''}><span>${escapeHtml(x.name)}</span></label>`).join(''); }
    function openMove(id){ movingDocIds=[id]; movingDocId=id; renderMoveLibraries(docs.find(x=>x.id===id).library); moveModal.classList.add('show'); }
    function saveMove(){ const target=document.querySelector('input[name="moveTargetLibrary"]:checked'); if(!target){ toast('请选择知识库'); return; } const count=movingDocIds.length; docs.filter(x=>movingDocIds.includes(x.id)).forEach(x=>x.library=target.value); selectedDocIds.clear(); closeModal('moveModal'); render(); toast(`已移动 ${count} 份文档`); }
    const docs = [
      {id:1,library:'operations',name:'2026 年门店员工行为规范',size:'2.4 M',status:'正常',uploader:'王小青',time:'2026-10-08 10:25'},
      {id:2,library:'sales',name:'销售顾问会员卡推荐话术',size:'1.8 M',status:'正常',uploader:'李晓',time:'2026-10-07 16:40'},
      {id:4,library:'operations',name:'门店会员投诉处理流程',size:'1.2 M',status:'正常',uploader:'张明',time:'2026-10-06 09:36'},
      {id:5,library:'operations',name:'菠菜平台排课操作说明',size:'4.1 M',status:'解析失败',uploader:'孙悦',time:'2026-10-05 17:02'}
    ];
    const totalCapacity = 200;
    const statusClass = s => ({'正常':'ready','解析中':'processing','解析失败':'failed'})[s];
    function updateCapacity(){ const used=docs.reduce((sum, doc) => sum + Number.parseFloat(doc.size), 0); capacityTrack.title=`已用空间 ${used.toFixed(1)} M / 总空间 ${totalCapacity} M`; capacityTrack.setAttribute('aria-valuenow',used.toFixed(1)); capacityTrack.setAttribute('aria-valuetext',capacityTrack.title); capacityValue.style.width=`${Math.min(used / totalCapacity * 100, 100)}%`; }
    function updateDateRange(){ uploadStartDate.max=uploadEndDate.value; uploadEndDate.min=uploadStartDate.value; if(uploadStartDate.value&&uploadEndDate.value&&uploadStartDate.value>uploadEndDate.value){ toast('开始日期不能晚于结束日期'); return; } render(); }
    function filteredDocs(){ const k=keyword.value.trim(), u=uploader.value.trim(), start=uploadStartDate.value, end=uploadEndDate.value; return docs.filter(d => (d.library===activeLibrary) && (!k || d.name.includes(k)) && (!status.value || d.status===status.value) && (!u || d.uploader.includes(u)) && (!start || d.time.slice(0,10)>=start) && (!end || d.time.slice(0,10)<=end)); }
    function render(){ renderLibraries(); const list=filteredDocs(); for(const id of selectedDocIds){ if(!list.some(d=>d.id===id)) selectedDocIds.delete(id); } document.getElementById('documentRows').innerHTML=list.map(d => `<tr><td title="${escapeHtml(d.name)}"><label class="name-selection"><input type="checkbox" aria-label="选择${escapeHtml(d.name)}" ${selectedDocIds.has(d.id)?'checked':''} onchange="toggleDoc(${d.id},this.checked)"><span>${escapeHtml(d.name)}</span></label></td><td>${escapeHtml(libraryNameOf(d.library))}</td><td>${d.size}</td><td><span class="status ${statusClass(d.status)}">${d.status}</span></td><td>${d.uploader}</td><td>${d.time}</td><td><button class="text-action" onclick="sourceFileById(${d.id})">预览</button>${d.status==='解析失败'?`<span class="action-sep">|</span><button class="text-action retry" onclick="reparse(${d.id})">重试</button>`:''}<span class="action-sep">|</span><button class="text-action" onclick="openMove(${d.id})">移动</button><span class="action-sep">|</span><button class="text-action danger" onclick="deleteDoc(${d.id})">删除</button></td></tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:#758195">暂无符合条件的文档</td></tr>'; document.getElementById('total').textContent=`共 ${list.length} 条`; updateCapacity(); updateBatchActions(); }
    function toggleDoc(id,checked){ if(checked) selectedDocIds.add(id); else selectedDocIds.delete(id); updateBatchActions(); }
    function toggleAllDocs(checked){ filteredDocs().forEach(d=>{ if(checked) selectedDocIds.add(d.id); else selectedDocIds.delete(d.id); }); render(); }
    function updateBatchActions(){ const list=filteredDocs(), selected=list.filter(d=>selectedDocIds.has(d.id)); selectAllDocs.checked=list.length>0&&selected.length===list.length; selectAllDocs.indeterminate=selected.length>0&&selected.length<list.length; selectAllDocs.disabled=list.length===0; batchMove.disabled=batchDelete.disabled=selected.length===0; batchRetry.disabled=!selected.some(d=>d.status==='解析失败'); }
    function openBatchMove(){ movingDocIds=filteredDocs().filter(d=>selectedDocIds.has(d.id)).map(d=>d.id); if(!movingDocIds.length) return; renderMoveLibraries(activeLibrary); moveModal.classList.add('show'); }
    function deleteSelectedDocs(){ const ids=filteredDocs().filter(d=>selectedDocIds.has(d.id)).map(d=>d.id); if(!ids.length||!confirm(`确认删除选中的 ${ids.length} 份文档吗？`)) return; for(let i=docs.length-1;i>=0;i--) if(ids.includes(docs[i].id)) docs.splice(i,1); selectedDocIds.clear(); render(); toast(`已删除 ${ids.length} 份文档`); }
    function retrySelectedDocs(){ const failed=filteredDocs().filter(d=>selectedDocIds.has(d.id)&&d.status==='解析失败'); if(!failed.length) return; failed.forEach(d=>d.status='解析中'); selectedDocIds.clear(); render(); toast(`已对 ${failed.length} 份解析失败文档发起重试`); }
    function resetFilters(){ selectedDocIds.clear(); keyword.value=''; status.value=''; uploader.value=''; uploadStartDate.value=''; uploadEndDate.value=''; uploadStartDate.max=''; uploadEndDate.min=''; render(); }
    function closeModal(id){ document.getElementById(id).classList.remove('show'); }
    function sourceFileById(id){ sourceFile(docs.find(d=>d.id===id).name); }
    function sourceFile(name){ toast(`${name||'源'}文件已打开（演示反馈）`); }
    function reparse(id){ const d=docs.find(x=>x.id===id); d.status='解析中'; render(); toast('已发起重试'); }
    function deleteDoc(id){ const i=docs.findIndex(x=>x.id===id); if(confirm('确认删除该文档吗？')){ docs.splice(i,1); render(); toast('文档已删除'); } }
    let uploadScenario = 'normal', hasSelectedFile = false, pendingDuplicateUpload = null;
    function openUpload(){ uploadLibrary.innerHTML=libraryOptions(activeLibrary,true); uploadLibrary.value=activeLibrary; hasSelectedFile=false; fileStatus.className='upload-file-status'; fileStatus.textContent=''; uploadName.value=''; uploadScenario='normal'; selectScenario('normal'); clearUploadError(); uploadModal.classList.add('show'); }
    function mockSelectFile(){ simulateUploadSuccess(); }
    function simulateUploadSuccess(){ hasSelectedFile=true; fileStatus.className='upload-file-status success'; fileStatus.innerHTML='<span>已上传：门店运营知识说明.pdf</span><button class="text-action danger" type="button" onclick="removeUploadedFile()">删除</button>'; if(!uploadName.value) uploadName.value='门店运营知识说明'; clearUploadError(); }
    function simulateUploadFailure(){ hasSelectedFile=false; fileStatus.className='upload-file-status failure'; fileStatus.innerHTML='<span>上传失败，请检查网络后重试</span><button class="text-action retry" type="button" onclick="retryUploadFile()">重试</button>'; }
    function retryUploadFile(){ simulateUploadSuccess(); toast('文件上传成功'); }
    function removeUploadedFile(){ hasSelectedFile=false; fileStatus.className='upload-file-status'; fileStatus.textContent=''; }
    function selectScenario(scenario){ uploadScenario=scenario; document.querySelectorAll('.scenario-button').forEach(button=>button.classList.toggle('active',button.dataset.scenario===scenario)); }
    function clearUploadError(){ uploadLibrary.classList.remove('field-error'); uploadName.classList.remove('field-error'); uploadZone.classList.remove('field-error'); }
    function uploadDocument(){ const name=uploadName.value.trim(); clearUploadError(); if(uploadScenario==='missing' || !name || !hasSelectedFile || !uploadLibrary.value){ if(!uploadLibrary.value) uploadLibrary.classList.add('field-error'); uploadZone.classList.add('field-error'); uploadName.classList.add('field-error'); toast('请补充所有必填内容'); return; } const uploadData={name,library:uploadLibrary.value}; closeModal('uploadModal'); startExtraction(uploadData); }
    function startExtraction(uploadData){ let progress=0; progressValue.style.width='0%'; progressNumber.textContent='0%'; progressModal.classList.add('show'); const timer=setInterval(()=>{ progress=Math.min(progress+20,100); progressValue.style.width=`${progress}%`; progressNumber.textContent=`${progress}%`; if(progress===100){ clearInterval(timer); setTimeout(()=>finishExtraction(uploadData),260); } },240); }
    function finishExtraction(uploadData){ closeModal('progressModal'); if(uploadScenario==='failure'){ showExtractionFailure(); return; } if(uploadScenario==='duplicate'){ showDuplicateResult(uploadData); return; } addParsingDocument(uploadData); toast('内容提取成功，已进入解析中'); }
    function addParsingDocument(uploadData){ const document={id:Date.now(),name:uploadData.name,library:uploadData.library,size:'1.8 M',status:'解析中',uploader:'知识库管理员',time:'2026-10-08 11:00'}; docs.unshift(document); resetFilters(); return document; }
    function showExtractionFailure(){ resultTitle.textContent='内容提取失败'; resultMessage.textContent='未能从文件中提取有效信息，请检查文件内容后重新上传。'; resultFooter.innerHTML='<button class="primary" onclick="returnToUploadForm()">我知道了</button>'; resultModal.classList.add('show'); }
    function returnToUploadForm(){ closeModal('resultModal'); hasSelectedFile=false; fileStatus.className='upload-file-status'; fileStatus.textContent=''; clearUploadError(); uploadModal.classList.add('show'); }
    function showResult(title,message){ resultTitle.textContent=title; resultMessage.textContent=message; resultFooter.innerHTML='<button class="primary" onclick="closeModal(\'resultModal\')">我知道了</button>'; resultModal.classList.add('show'); }
    function showDuplicateResult(uploadData){ const existing=docs.find(d=>d.library===uploadData.library); if(!existing){ addParsingDocument(uploadData); toast('当前知识库无重复文档，已进入解析中'); return; } pendingDuplicateUpload=uploadData; resultTitle.textContent='内容重复'; resultMessage.innerHTML=`文档内容与《${escapeHtml(existing.name)}》相似度达到 92%，请选择处理方式。`; resultFooter.innerHTML=`<button onclick="replaceDuplicate(${existing.id})">替换文件</button><button class="primary" onclick="keepBoth()">保留两者</button><button onclick="returnToDuplicateUploadForm()">取消</button>`; resultModal.classList.add('show'); }
    function replaceDuplicate(id){ const replacedDocument=docs.find(d=>d.id===id); const currentDocument=addParsingDocument(pendingDuplicateUpload); pendingDuplicateUpload=null; closeModal('resultModal'); toast('当前文件正在处理，完成后将替换相似度最高的文件'); setTimeout(()=>{ currentDocument.status='正常'; const index=docs.findIndex(d=>d.id===replacedDocument.id); if(index>-1) docs.splice(index,1); render(); toast('已完成处理，并删除相似文件及对应切片'); },1000); }
    function keepBoth(){ resultTitle.textContent='保留两者'; resultMessage.textContent='知识库内存在多个版本的文件时，AI 可能会检索到旧版文件，提供错误回答。请确认是否保持两份文件共存。'; resultFooter.innerHTML='<button onclick="returnToDuplicateUploadForm()">取消</button><button class="primary" onclick="confirmKeepBoth()">确定</button>'; }
    function confirmKeepBoth(){ addParsingDocument(pendingDuplicateUpload); pendingDuplicateUpload=null; closeModal('resultModal'); toast('已保留两者，新文件正在解析'); }
    function returnToDuplicateUploadForm(){ closeModal('resultModal'); clearUploadError(); uploadModal.classList.add('show'); }
    let toastTimer; function toast(message){ const t=document.getElementById('toast'); t.textContent=message; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none',2400); }
    render();
  </script>
</body>
</html>
